# 임시 워크플로 — apps/admin/package-lock.json을 CI와 동일한 ubuntu-24.04 러너(Linux)에서
# 재생성하기 위한 1회성 작업. Windows 로컬에서 생성한 lockfile이 @tailwindcss/oxide 계열의
# 플랫폼별 optional dependency(@emnapi/*) 메타데이터를 비결정적으로 기록해 `npm ci`가 실패하는
# 문제를 CI와 같은 환경에서 재생성해 해소한다. 목적 달성 후 이 파일은 삭제한다(별도 커밋).
#
# push/PR 트리거 없음 — 수동 실행(workflow_dispatch)만. 다른 CI 워크플로에 영향 없다.
name: (임시) apps/admin lockfile 재생성

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    name: apps/admin package-lock.json 재생성 + 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: npm 버전 확인
        run: npm --version

      - name: lockfile 재생성
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: npm ci 재검증(같은 환경에서 방금 만든 lockfile)
        run: |
          rm -rf node_modules
          npm ci

      - name: package-lock.json 업로드
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-package-lock
          path: apps/admin/package-lock.json
          retention-days: 3
