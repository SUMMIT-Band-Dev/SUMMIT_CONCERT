# CI (work02-7a)
#
# 원칙
# - **비밀값을 쓰지 않는다.** 저장소 비밀값·변수 컨텍스트를 참조하지 않고, 포크 PR에 저장소 권한을 넘겨주는
#   이벤트 유형도 쓰지 않는다(포크에서 온 PR 코드가 비밀값을 가진 채 실행되는 경로를 만들지 않기 위함).
#   이 레포는 Public이다. 트리거는 pull_request 와 push 뿐이다
# - 기본 권한은 읽기 전용(`contents: read`)
# - 액션은 태그가 아니라 **커밋 SHA로 고정**한다(태그는 옮겨질 수 있다). 버전은 주석에 남긴다.
#   갱신할 때는 릴리스 태그의 SHA를 GitHub에서 확인하고, action.yml의 입력 이름이 그대로인지 본다
#
# 러너: `ubuntu-latest`가 아니라 **버전을 고정한 `ubuntu-24.04`**를 쓴다. `-latest`는 1~2개월에 걸쳐 조용히 다음 OS로 옮겨 가서
# 어느 날 CI가 이유 없이 깨질 수 있다(GitHub runner-images 문서). 2026-09-21 기준 `ubuntu-latest`가 가리키는 안정판이 24.04이고,
# 그보다 새 `ubuntu-26.04`는 공식 공지상 **public preview**(GA 아님)라 채택하지 않았다. 22.04는 2026-09-17부터 deprecation이 시작됐다.
# GA가 되면 그때 올린다 — 올릴 때는 이 파일에서 두 잡의 runs-on 을 함께 바꾼다.
#
# 트리거: pull_request 와 develop·main 으로의 push. main 은 배포 브랜치라 직접 푸시(규칙상 금지지만 막는 장치는 없다)도 검증한다.
#
# 범위: apps/api 는 lint·build·test·타입 검사(스펙 포함)를, apps/admin(관리자 프론트)은 lint·build·타입 검사·test를,
# 루트 Next.js 앱은 lint만 검사한다. 잠금 파일은 세 곳(루트·apps/api·apps/admin)이 각각 독립이라 잡마다 자기 것으로 npm ci 한다.
# 루트 `next build`는 `NEXT_PUBLIC_SUPABASE_*` 없이는 실패한다(`supabaseUrl is required`, 2026-09-21 실측).
# 그 값들은 브라우저에 노출되는 공개 값이지만, 어떤 값을 CI에 둘지는 별도로 정한다.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: apps/api (lint · build · test · typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # 생성된 Prisma 클라이언트(src/generated)는 gitignore라 커밋돼 있지 않아 CI에서 만들어야 한다.
      # prisma.config.ts가 로드될 때 env('DATABASE_URL')이 값을 요구해서(없으면 PrismaConfigEnvError로 실패,
      # 2026-09-21 실측) 이 단계에만 자리표시 값을 준다. generate는 DB에 접속하지 않으므로 실제 접속 정보가 아니다.
      # 다른 단계에는 주지 않는다 — 테스트가 DB를 쓰지 않는다는 것을 매번 확인하기 위해서다.
      - name: Prisma 클라이언트 생성
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/ci

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build

      - name: 테스트
        run: npm test

      # tsconfig.build.json은 스펙을 제외하고 vitest는 타입을 검사하지 않아서, 스펙의 타입 오류는 여기서만 잡힌다
      - name: 타입 검사 (스펙 포함)
        run: npm run typecheck

  web:
    name: web (lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

  admin:
    name: apps/admin (lint · build · typecheck · test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      # apps/admin/package.json의 packageManager와 맞춘다. node-version이 가리키는 24.x 패치가 바뀌면
      # 번들 npm 버전도 조용히 달라질 수 있어(2026-09-22 실측: 로컬 11.6.2 vs 이 값), 로컬/CI 드리프트로
      # lockfile 재현성이 깨지는 것을 막기 위해 명시적으로 고정한다(REFACTOR_NOTES.md §18 참조).
      - name: npm 버전 고정
        run: npm install -g npm@11.19.0

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # NEXT_PUBLIC_API_BASE_URL은 브라우저 번들에 그대로 박히는 공개 값이라 비밀이 아니다. 비밀값·저장소 변수는 참조하지 않는다.
      # 여기 값은 자리표시일 뿐이다(빌드가 CSP 헤더와 번들에 이 값을 쓰므로 유효한 http(s) 주소여야 한다).
      # 배포 값은 Vercel 프로젝트의 환경변수에 따로 있다.
      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

      # 빌드가 next-env.d.ts와 .next/types를 만든 뒤에 실행해야 타입 검사가 통과한다
      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test
